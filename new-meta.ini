# ==========================================================
# OpenClash Extreme Performance Edition (R2S/R3S)
# ==========================================================

mixed-port: 7890
allow-lan: true
mode: rule
log-level: silent
ipv6: false

external-controller: 0.0.0.0:9090

# ==========================================================
# DNS（极限抗污染 + 低负载）
# ==========================================================
dns:
  enable: true
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  nameserver:
    - 223.5.5.5
    - 119.29.29.29

  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN

# ==========================================================
# Proxy Groups（极简高效结构）
# ==========================================================
proxy-groups:

  - name: 🚀 AUTO
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    filter: '.*'

  - name: 🌍 PROXY
    type: select
    proxies:
      - 🚀 AUTO
      - 🇭🇰 HK
      - 🇹🇼 TW
      - 🇯🇵 JP
      - 🇸🇬 SG
      - 🇺🇸 US
      - 🧊 COLD
      - DIRECT

  - name: 🧊 COLD
    type: select
    filter: '(?i)^(?!.*(HK|香港|JP|日本|TW|台湾|SG|新加坡|US|美国)).*'

# ==========================================================
# 国家节点（轻量测速）
# ==========================================================
  - name: 🇭🇰 HK
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(HK|香港|hongkong)'

  - name: 🇹🇼 TW
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(TW|台湾|taiwan|taipei)'

  - name: 🇯🇵 JP
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(JP|日本|tokyo|osaka)'

  - name: 🇸🇬 SG
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(SG|新加坡|singapore)'

  - name: 🇺🇸 US
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(US|美国|united states|los angeles|new york)'

# ==========================================================
# RULES（极限优化核心）
# ==========================================================
rules:

  # ================= 安全 & 内网 =================
  - GEOSITE,private,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # ================= 国内直连 =================
  - GEOSITE,cn,DIRECT
  - GEOSITE,google-cn,DIRECT

  # ================= 关键海外服务（最小集合） =================
  - GEOSITE,google,🌍 PROXY
  - GEOSITE,openai,🌍 PROXY
  - GEOSITE,telegram,🌍 PROXY
  - GEOSITE,github,🌍 PROXY
  - GEOSITE,cloudflare,🌍 PROXY

  - GEOSITE,youtube,🌍 PROXY
  - GEOSITE,netflix,🌍 PROXY

  - GEOSITE,apple,DIRECT

  # ================= 社交（合并减少规则） =================
  - GEOSITE,category-social-media-!cn,🌍 PROXY

  # ================= 游戏 =================
  - GEOSITE,steam,DIRECT

  # ================= 交易所 =================
  - GEOSITE,binance,🌍 PROXY
  - GEOSITE,okx,🌍 PROXY
  - GEOSITE,bybit,🌍 PROXY

  # ================= GFW =================
  - GEOSITE,gfw,🌍 PROXY

  # ================= FINAL（必须最后） =================
  - MATCH,🌍 PROXY
