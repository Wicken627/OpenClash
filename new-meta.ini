# ==========================================================
# OpenClash Stable Profile - Fixed Edition
# ==========================================================

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false

external-controller: 0.0.0.0:9090

# DNS（防 GeoSite 误判关键）
dns:
  enable: true
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 1.1.1.1
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

# ==========================================================
# Proxy Groups（核心策略组）
# ==========================================================

proxy-groups:

  - name: 🌐 Default
    type: select
    proxies:
      - 🇭🇰 HK
      - 🇹🇼 TW
      - 🇯🇵 JP
      - 🇸🇬 SG
      - 🇺🇸 US
      - 🧊 冷门节点
      - DIRECT

  - name: 🚀 手动选择
    type: select
    proxies:
      - 🌐 Default
      - 🇭🇰 HK
      - 🇹🇼 TW
      - 🇯🇵 JP
      - 🇸🇬 SG
      - 🇺🇸 US
      - 🧊 冷门节点
      - DIRECT

  - name: 🧊 冷门节点
    type: select
    filter: '(?i)^(?!.*(🇭🇰|香港|\bHK\b|hong\s*kong|🇯🇵|日本|\bJP\b|tokyo|osaka|🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet|🇸🇬|新加坡|\bSG\b|singapore|🇺🇸|美国|\bUS\b|united\s*states|los\s*angeles|new\s*york|seattle)).*'

  # ================= 国家测速组 =================
  - name: 🇭🇰 HK
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(🇭🇰|香港|\bHK\b|hongkong)'

  - name: 🇹🇼 TW
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet)'

  - name: 🇯🇵 JP
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(🇯🇵|日本|\bJP\b|tokyo|osaka)'

  - name: 🇸🇬 SG
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(🇸🇬|新加坡|\bSG\b|singapore)'

  - name: 🇺🇸 US
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: '(?i)(🇺🇸|美国|\bUS\b|united states|los angeles|new york|seattle)'

# ==========================================================
# Rules（核心修复重点）
# ==========================================================

rules:

  # --- Adobe（阻断）---
  - GEOSITE,adobe,REJECT
  - GEOIP,adobe,REJECT,no-resolve

  # --- 私网直连 ---
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # --- CN 直连（必须提前）---
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # --- Google（修复：禁止 GEOIP 干扰）---
  - GEOSITE,google-cn,DIRECT
  - GEOSITE,google,🌐 Default

  # --- Microsoft ---
  - GEOSITE,microsoft,🌐 Default

  # --- Cloudflare ---
  - GEOSITE,cloudflare,🌐 Default

  # --- Telegram ---
  - GEOSITE,telegram,🌐 Default

  # --- Notion ---
  - GEOSITE,notion,🌐 Default

  # --- OpenAI / ChatGPT ---
  - GEOSITE,openai,🌐 Default

  # --- Apple ---
  - GEOSITE,apple,🌐 Default

  # --- YouTube ---
  - GEOSITE,youtube,🌐 Default

  # --- Netflix ---
  - GEOSITE,netflix,🌐 Default
  - GEOIP,netflix,🌐 Default,no-resolve

  # --- TikTok ---
  - GEOSITE,tiktok,🌐 Default

  # --- Instagram / X ---
  - GEOSITE,instagram,🌐 Default
  - GEOSITE,twitter,🌐 Default

  # --- GitHub ---
  - GEOSITE,github,🌐 Default

  # --- Steam ---
  - GEOSITE,steam,DIRECT

  # --- 交易所 ---
  - GEOSITE,okx,🌐 Default
  - GEOSITE,binance,🌐 Default
  - GEOSITE,bybit,🌐 Default

  # --- GFW ---
  - GEOSITE,gfw,🚀 手动选择

  # --- 非标端口 ---
  - RULE-SET,https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,🔀 非标端口

  # --- FINAL（必须放最后）---
  - MATCH,🌐 Default
