[custom]

; ==========================================================
; OpenClash 高级规则模板（增强稳定版）
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website

; ==========================================================
; 1. 基础直连（最高优先级）
; ==========================================================
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; Google CN / 游戏 / 下载直连
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; ==========================================================
; 2. 核心应用分流（精准优先）
; ==========================================================
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn

ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix

ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=🔎 Google,[]GEOSITE,google
ruleset=☁️ Cloudflare,[]GEOSITE,cloudflare

ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🎮 Steam,[]GEOSITE,steam

ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

; ==========================================================
; 3. 金融交易所
; ==========================================================
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟪 Bybit,[]GEOSITE,bybit

; ==========================================================
; 4. 社交 / 通讯 / 工具
; ==========================================================
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=↔️ TeamViewer,[]GEOSITE,teamviewer

; ==========================================================
; 5. 特殊直连 / 代理补丁（外部规则）
; ==========================================================
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; ==========================================================
; 6. GFW 兜底
; ==========================================================
ruleset=🚀 手动选择,[]GEOSITE,gfw

; ==========================================================
; 7. 非标端口
; ==========================================================
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; ==========================================================
; 8. 最终兜底
; ==========================================================
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 9. 策略组（核心 UI）
; ==========================================================

; ---------------- 主应用组 ----------------
custom_proxy_group=🤖 ChatGPT`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧠 AI`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🧠 AI`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default

custom_proxy_group=📨 Telegram`select`[]🇸🇬 SG`[]🇺🇸 US`[]🇯🇵 JP`[]🧭 手动选择`[]♻️ 自动选择`[]🌐 Default
custom_proxy_group=🎬 YouTube`select`[]🇸🇬 SG`[]🇺🇸 US`[]🇯🇵 JP`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=🎥 Netflix`select`[]🇸🇬 SG`[]🇺🇸 US`[]🇯🇵 JP`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default

custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🇭🇰 HK`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 HK`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=🔎 Google`select`[]🇸🇬 SG`[]🇺🇸 US`[]🇯🇵 JP`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=☁️ Cloudflare`select`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default

custom_proxy_group=🧑‍💻 GitHub`select`[]🇸🇬 SG`[]🇺🇸 US`[]🇯🇵 JP`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default

; ---------------- 社交 ----------------
custom_proxy_group=📞 即时通讯`select`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=💬 社交媒体`select`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=🎵 TikTok`select`[]🇸🇬 SG`[]🇺🇸 US`[]🇯🇵 JP`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=📸 Instagram`select`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default
custom_proxy_group=🐦 X`select`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🧭 手动选择`[]🌐 Default

; ---------------- 交易所 ----------------
custom_proxy_group=🟨 Binance`select`[]🇸🇬 SG`[]🇺🇸 US`[]🧭 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default
custom_proxy_group=🟦 OKX`select`[]🇸🇬 SG`[]🇺🇸 US`[]🧭 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default
custom_proxy_group=🟪 Bybit`select`[]🇸🇬 SG`[]🇺🇸 US`[]🧭 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default

; ---------------- 控制组 ----------------
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇸🇬 SG`[]🇺🇸 US`[]🇯🇵 JP`[]🇭🇰 HK`[]🇹🇼 TW`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50

custom_proxy_group=🌐 Default`select`[]♻️ 自动选择`[]🚀 手动选择`[]🇸🇬 SG`[]🇺🇸 US`[]DIRECT

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]♻️ 自动选择`[]🚀 手动选择`[]DIRECT

; ---------------- 国家组（测速） ----------------
custom_proxy_group=🇭🇰 HK`url-test`(?i)(hong|hk|香港)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 TW`url-test`(?i)(taiwan|tw|台湾)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 JP`url-test`(?i)(japan|jp|日本|tokyo|osaka)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 SG`url-test`(?i)(singapore|sg|新加坡)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 US`url-test`(?i)(us|usa|united|los|newyork|seattle)`http://www.gstatic.com/generate_204`300,,50

; ---------------- 冷门节点池（优化版） ----------------
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(hk|hong|tw|taiwan|jp|japan|sg|singapore|us|usa|united|los|seattle|newyork)).*


; ==========================================================
; END
; ==========================================================
